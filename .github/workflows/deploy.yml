name: Deploy servidor

# Auto-deploy del backoffice al servidor de producción. Solo en push a main, y solo si pasan
# las comprobaciones (typecheck, lint, pruebas y build). El servidor acepta esta llave únicamente
# para ejecutar el script de despliegue del backoffice (comando forzado).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-mialiado-backoffice
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Empaquetar dist
        run: tar czf "$RUNNER_TEMP/release.tar.gz" -C dist .

      - name: Configurar acceso SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Desplegar
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts "mialiado@$DEPLOY_HOST" < "$RUNNER_TEMP/release.tar.gz"
